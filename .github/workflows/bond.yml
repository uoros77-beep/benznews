# 공채 즉시매도 할인율 · 매일 오전 9시(한국시간) 자동 갱신
name: bond-rate
on:
  schedule:
    - cron: "5 0 * * *"      # UTC 00:05 = 한국시간 09:05 (은행 고시 직후)
  workflow_dispatch: {}       # Actions 탭에서 수동 실행 가능
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 할인율 읽어오기
        env:
          BOND_URL: ${{ vars.BOND_URL }}
        run: python scripts/fetch_bond.py
      - name: 바뀐 값만 저장
        run: |
          git config user.name  "benznews-bot"
          git config user.email "bot@benznews.net"
          git add data/bond.json data/bond_log.json || true
          git diff --cached --quiet || git commit -m "공채 할인율 자동 갱신 $(TZ=Asia/Seoul date +%F)"
          git push
